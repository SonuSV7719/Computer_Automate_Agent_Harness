[project]
name = "shadow"
version = "0.1.0"
description = "Teach a desktop task once; replay it as code at RPA speed; heal with Gemini when the UI changes."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sonu Vishwakarma"}]
readme = "README.md"
dependencies = [
    "comtypes>=1.4; sys_platform == 'win32'",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mss>=9.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
shadow = "shadow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shadow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
